<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>sleep.</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --bg:#000000;
    --surface:rgba(255,255,255,.035);
    --surface-strong:rgba(255,255,255,.06);
    --border:rgba(255,255,255,.08);
    --text:rgba(255,255,255,.92);
    --muted:rgba(255,255,255,.42);
    --accent:#7dd3fc;
    --accent2:#818cf8;
  }

  *{
    -webkit-tap-highlight-color: transparent;
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:
      Inter,
      system-ui,
      -apple-system,
      sans-serif;
    color:var(--text);
  }

  body{
    position:relative;
    background:
      radial-gradient(circle at top,
      rgba(59,130,246,.12),
      transparent 35%),

      radial-gradient(circle at bottom,
      rgba(99,102,241,.08),
      transparent 40%),

      #000;
  }

  canvas#bg{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:.85;
    pointer-events:none;
  }

  .app{
    position:relative;
    z-index:2;
    height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    overflow:hidden;
  }

  .glass{
    background:var(--surface);
    border:1px solid var(--border);
    backdrop-filter:blur(24px);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
  }

  .logo{
    font-size:1.4rem;
    letter-spacing:.25em;
    font-weight:300;
    opacity:.95;
  }

  .top-actions{
    display:flex;
    gap:10px;
  }

  .icon-btn{
    width:42px;
    height:42px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.25s;
  }

  .icon-btn:hover{
    transform:scale(1.05);
    background:rgba(255,255,255,.06);
  }

  main{
    display:flex;
    align-items:center;
    justify-content:center;
    padding-inline:20px;
    min-height:0;
  }

  .hero{
    position:relative;
    width:min(72vw, 360px);
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  #visualizer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .center-ui{
    position:relative;
    z-index:3;
    text-align:center;
    pointer-events:none;
  }

  .center-ui h2{
    margin:0;
    font-size:clamp(2rem,5vw,3rem);
    font-weight:250;
    letter-spacing:.03em;
  }

  .center-ui p{
    margin-top:8px;
    font-size:.72rem;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .dock{
    padding:
      0
      16px
      calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .preset-row{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:2px;
  }

  .preset-row::-webkit-scrollbar{
    display:none;
  }

  .preset{
    border:none;
    color:var(--text);
    padding:12px 18px;
    border-radius:999px;
    white-space:nowrap;
    cursor:pointer;
    transition:.3s;
    background:var(--surface);
    border:1px solid transparent;
    font-size:.82rem;
  }

  .preset.active{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14);
  }

  .controls{
    display:grid;
    grid-template-columns:
      1fr auto;
    gap:14px;
    padding:16px;
    border-radius:28px;
  }

  .volume-wrap{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .volume-wrap span{
    font-size:.8rem;
    color:var(--muted);
  }

  input[type="range"]{
    width:100%;
    appearance:none;
    height:3px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
    outline:none;
  }

  input[type="range"]::-webkit-slider-thumb{
    appearance:none;
    width:16px;
    height:16px;
    border-radius:999px;
    background:white;
    cursor:pointer;
  }

  .timers{
    display:flex;
    gap:8px;
  }

  .timer-btn{
    border:none;
    color:var(--text);
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.05);
    padding:10px 14px;
    border-radius:999px;
    cursor:pointer;
    font-size:.75rem;
  }

  .modal{
    position:fixed;
    inset:0;
    z-index:100;
    background:
      radial-gradient(circle at top,
      rgba(59,130,246,.08),
      transparent 30%),
      rgba(0,0,0,.96);

    backdrop-filter:blur(30px);

    transform:translateY(100%);
    transition:.4s cubic-bezier(.22,.61,.36,1);

    display:flex;
    flex-direction:column;
  }

  .modal.open{
    transform:translateY(0);
  }

  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
  }

  .modal-content{
    flex:1;
    overflow:auto;
    padding:10px 20px 40px;
  }

  .setting{
    margin-bottom:34px;
  }

  .setting label{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    font-size:.9rem;
  }

  .setting span{
    color:var(--muted);
  }

  .save-btn{
    width:100%;
    border:none;
    border-radius:22px;
    padding:18px;
    color:white;
    cursor:pointer;
    margin-top:30px;
    background:
      linear-gradient(
        135deg,
        rgba(59,130,246,.22),
        rgba(99,102,241,.18)
      );

    border:1px solid rgba(255,255,255,.08);
  }

  @media (max-height:740px){

    header{
      padding-top:12px;
      padding-bottom:8px;
    }

    .hero{
      width:min(60vw,250px);
    }

    .dock{
      gap:10px;
    }

    .controls{
      padding:12px;
    }

    .preset{
      padding:10px 15px;
    }
  }
</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="app">

  <header>

    <div class="logo">
      sleep.
    </div>

    <div class="top-actions">

      <button
        class="glass icon-btn"
        onclick="toggleTheme()"
        id="theme-btn"
      >
        ✦
      </button>

      <button
        class="glass icon-btn"
        onclick="toggleSettings()"
      >
        ⚙
      </button>

    </div>

  </header>

  <main>

    <div class="hero" onclick="togglePlayPause()">

      <canvas id="visualizer"></canvas>

      <div class="center-ui">
        <h2 id="sound-name">
          Sleep
        </h2>

        <p id="status-text">
          TAP TO START
        </p>
      </div>

    </div>

  </main>

  <section class="dock">

    <div class="preset-row">

      <button class="preset active" onclick="loadPreset(0)">
        White
      </button>

      <button class="preset" onclick="loadPreset(1)">
        Pink
      </button>

      <button class="preset" onclick="loadPreset(2)">
        Brown
      </button>

      <button class="preset" onclick="loadPreset(3)">
        Deep
      </button>

      <button class="preset" onclick="loadPreset(4)">
        Rain
      </button>

    </div>

    <div class="controls glass">

      <div class="volume-wrap">

        <span>
          VOL
        </span>

        <input
          type="range"
          id="volume"
          min="0"
          max="100"
          value="28"
          oninput="updateVolume(this.value)"
        />

      </div>

      <div class="timers">

        <button class="timer-btn" onclick="setTimer(15)">
          15m
        </button>

        <button class="timer-btn" onclick="setTimer(30)">
          30m
        </button>

        <button class="timer-btn" onclick="setTimer(0)">
          ∞
        </button>

      </div>

    </div>

  </section>

</div>

<div class="modal" id="settings-modal">

  <div class="modal-header">

    <h3 style="font-weight:300;letter-spacing:.08em;">
      Advanced Lab
    </h3>

    <button
      class="glass icon-btn"
      onclick="toggleSettings()"
    >
      ✕
    </button>

  </div>

  <div class="modal-content">

    <div class="setting">
      <label>
        Low Frequency
        <span id="low-val">80Hz</span>
      </label>

      <input
        type="range"
        id="lowcut"
        min="30"
        max="350"
        value="80"
        oninput="updateFilters()"
      />
    </div>

    <div class="setting">
      <label>
        High Frequency
        <span id="high-val">8000Hz</span>
      </label>

      <input
        type="range"
        id="highcut"
        min="2000"
        max="16000"
        value="8000"
        oninput="updateFilters()"
      />
    </div>

    <div class="setting">
      <label>
        Bass
        <span id="bass-val">50</span>
      </label>

      <input
        type="range"
        id="bass"
        min="0"
        max="100"
        value="50"
        oninput="updateFilters()"
      />
    </div>

    <div class="setting">
      <label>
        Turbulence
        <span id="turb-val">40</span>
      </label>

      <input
        type="range"
        id="turbulence"
        min="0"
        max="100"
        value="40"
        oninput="updateFilters()"
      />
    </div>

    <button
      class="save-btn"
      onclick="saveCustomPreset()"
    >
      Save Configuration
    </button>

  </div>

</div>

<script>

let audioContext;
let gainNode;
let filterLow;
let filterHigh;
let currentSource = null;

let currentType = "white";
let isPlaying = false;
let timerId = null;

const bg = document.getElementById("bg");
const bgCtx = bg.getContext("2d");

let particles = [];

function resizeCanvas(){
  bg.width = innerWidth;
  bg.height = innerHeight;
}

class Particle{

  constructor(){
    this.reset();
  }

  reset(){

    this.x = Math.random() * bg.width;
    this.y = Math.random() * bg.height;

    this.radius =
      Math.random() * 2 + .4;

    this.speed =
      Math.random() * .12 + .03;

    this.opacity =
      Math.random() * .2 + .02;
  }

  update(){

    this.y -= this.speed;

    if(this.y < -20){
      this.y = bg.height + 20;
      this.x = Math.random() * bg.width;
    }
  }

  draw(){

    bgCtx.beginPath();

    bgCtx.fillStyle =
      `rgba(125,211,252,${this.opacity})`;

    bgCtx.arc(
      this.x,
      this.y,
      this.radius,
      0,
      Math.PI * 2
    );

    bgCtx.fill();
  }
}

function initParticles(){

  particles =
    Array.from(
      {length:50},
      () => new Particle()
    );
}

function animateBackground(){

  bgCtx.clearRect(
    0,
    0,
    bg.width,
    bg.height
  );

  particles.forEach(p => {
    p.update();
    p.draw();
  });

  requestAnimationFrame(
    animateBackground
  );
}

const vCanvas =
  document.getElementById(
    "visualizer"
  );

const vCtx =
  vCanvas.getContext("2d");

function resizeVisualizer(){

  const size =
    vCanvas.offsetWidth;

  vCanvas.width = size * 2;
  vCanvas.height = size * 2;

  vCtx.scale(2,2);
}

let wave = 0;

function drawVisualizer(){

  const w =
    vCanvas.width / 2;

  const h =
    vCanvas.height / 2;

  vCtx.clearRect(0,0,w,h);

  const cx = w / 2;
  const cy = h / 2;

  wave += .008;

  if(isPlaying){

    for(let i=0;i<4;i++){

      const radius =
        72 +
        i * 18 +
        Math.sin(
          wave * 2 + i
        ) * 8;

      const opacity =
        .18 - i * .03;

      vCtx.beginPath();

      vCtx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
      );

      vCtx.strokeStyle =
        `rgba(125,211,252,${opacity})`;

      vCtx.lineWidth =
        1.5;

      vCtx.shadowBlur = 20;

      vCtx.shadowColor =
        "rgba(125,211,252,.25)";

      vCtx.stroke();
    }

  }else{

    vCtx.beginPath();

    vCtx.arc(
      cx,
      cy,
      84,
      0,
      Math.PI * 2
    );

    vCtx.strokeStyle =
      "rgba(255,255,255,.08)";

    vCtx.lineWidth = 1;

    vCtx.stroke();
  }

  requestAnimationFrame(
    drawVisualizer
  );
}

function initAudio(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    gainNode =
      audioContext.createGain();

    filterLow =
      audioContext.createBiquadFilter();

    filterHigh =
      audioContext.createBiquadFilter();

    filterLow.type =
      "lowshelf";

    filterHigh.type =
      "highshelf";

    filterLow.connect(filterHigh);

    filterHigh.connect(gainNode);

    gainNode.connect(
      audioContext.destination
    );
  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }
}

function createNoiseBuffer(type){

  const size =
    audioContext.sampleRate * 4;

  const buffer =
    audioContext.createBuffer(
      1,
      size,
      audioContext.sampleRate
    );

  const data =
    buffer.getChannelData(0);

  let last = 0;

  const turb =
    parseFloat(
      document.getElementById(
        "turbulence"
      ).value
    ) / 100;

  for(let i=0;i<size;i++){

    let val =
      Math.random() * 2 - 1;

    if(type !== "white"){

      val =
        (last + (
          turb * .018 * val
        )) / (
          1 + turb * .018
        );

      last = val;

      val *=
        type === "brown"
          ? 8
          : 3.5;
    }

    data[i] = val;
  }

  return buffer;
}

function playNoise(type){

  initAudio();

  if(currentSource){
    currentSource.stop();
  }

  currentType = type;

  const source =
    audioContext.createBufferSource();

  source.buffer =
    createNoiseBuffer(type);

  source.loop = true;

  source.connect(filterLow);

  source.start();

  currentSource = source;

  isPlaying = true;

  document.getElementById(
    "status-text"
  ).textContent =
    "SYNTHESIZING";

  updateFilters();
}

function togglePlayPause(){

  if(isPlaying){

    stopAll(false);

    document.getElementById(
      "status-text"
    ).textContent =
      "PAUSED";

  }else{

    playNoise(currentType);
  }
}

function stopAll(reset=false){

  if(currentSource){
    currentSource.stop();
  }

  currentSource = null;

  isPlaying = false;

  if(reset){

    document.getElementById(
      "sound-name"
    ).textContent = "Sleep";

    document.getElementById(
      "status-text"
    ).textContent =
      "TAP TO START";
  }
}

function updateVolume(val){

  if(gainNode){
    gainNode.gain.value =
      val / 100;
  }
}

function updateFilters(){

  if(!filterLow || !filterHigh){
    return;
  }

  const low =
    +document.getElementById(
      "lowcut"
    ).value;

  const high =
    +document.getElementById(
      "highcut"
    ).value;

  const bass =
    +document.getElementById(
      "bass"
    ).value;

  const turb =
    +document.getElementById(
      "turbulence"
    ).value;

  filterLow.frequency.value =
    low;

  filterLow.gain.value =
    bass / 6 - 4;

  filterHigh.frequency.value =
    high;

  filterHigh.gain.value =
    -10;

  document.getElementById(
    "low-val"
  ).textContent =
    low + "Hz";

  document.getElementById(
    "high-val"
  ).textContent =
    high + "Hz";

  document.getElementById(
    "bass-val"
  ).textContent =
    bass;

  document.getElementById(
    "turb-val"
  ).textContent =
    turb;
}

function setTimer(minutes){

  if(timerId){
    clearTimeout(timerId);
  }

  if(minutes === 0){

    document.getElementById(
      "status-text"
    ).textContent =
      "CONTINUOUS";

    return;
  }

  document.getElementById(
    "status-text"
  ).textContent =
    `${minutes} MIN TIMER`;

  timerId =
    setTimeout(() => {

      let vol =
        gainNode.gain.value;

      const fade =
        setInterval(() => {

          vol -= .02;

          if(vol <= 0){

            clearInterval(fade);

            stopAll();

          }else{

            gainNode.gain.value =
              vol;
          }

        },150);

    }, minutes * 60000);
}

function toggleSettings(){

  document
    .getElementById(
      "settings-modal"
    )
    .classList
    .toggle("open");
}

function saveCustomPreset(){

  const settings = {

    volume:
      document.getElementById(
        "volume"
      ).value,

    lowcut:
      document.getElementById(
        "lowcut"
      ).value,

    highcut:
      document.getElementById(
        "highcut"
      ).value,

    bass:
      document.getElementById(
        "bass"
      ).value,

    turbulence:
      document.getElementById(
        "turbulence"
      ).value,

    type: currentType
  };

  localStorage.setItem(
    "sleepPreset",
    JSON.stringify(settings)
  );

  toggleSettings();

  document.getElementById(
    "status-text"
  ).textContent =
    "CONFIG SAVED";
}

function toggleTheme(){

  document.body.classList.toggle(
    "warm-mode"
  );
}

function loadPreset(n){

  document
    .querySelectorAll(".preset")
    .forEach(el =>
      el.classList.remove("active")
    );

  document
    .querySelectorAll(".preset")[n]
    .classList.add("active");

  const presets = [

    {
      name:"White",
      type:"white",
      low:65,
      high:12500,
      bass:35,
      turb:25
    },

    {
      name:"Pink",
      type:"pink",
      low:95,
      high:9200,
      bass:55,
      turb:45
    },

    {
      name:"Brown",
      type:"brown",
      low:45,
      high:5800,
      bass:85,
      turb:65
    },

    {
      name:"Deep",
      type:"brown",
      low:55,
      high:4500,
      bass:90,
      turb:50
    },

    {
      name:"Rain",
      type:"pink",
      low:120,
      high:7800,
      bass:60,
      turb:55
    }
  ];

  const p = presets[n];

  document.getElementById(
    "sound-name"
  ).textContent =
    p.name;

  document.getElementById(
    "lowcut"
  ).value =
    p.low;

  document.getElementById(
    "highcut"
  ).value =
    p.high;

  document.getElementById(
    "bass"
  ).value =
    p.bass;

  document.getElementById(
    "turbulence"
  ).value =
    p.turb;

  playNoise(p.type);
}

window.onload = () => {

  resizeCanvas();

  resizeVisualizer();

  addEventListener(
    "resize",
    () => {

      resizeCanvas();

      resizeVisualizer();
    }
  );

  initParticles();

  animateBackground();

  drawVisualizer();

  updateVolume(28);

  updateFilters();
};

</script>

</body>
</html>
