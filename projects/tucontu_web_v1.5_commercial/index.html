<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TUCONTU">
  <title>TUCONTU · Web v1.7</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button id="brandBtn" class="brand">T U C O N T U</button>
    <div class="top-actions">
      <button id="materialsBtn" class="top-materials mobile-only">Materiales</button>
      <button id="newPieceTop" class="top-primary">+ Nueva</button>
      <div class="utility-wrap">
        <button id="utilityBtn" class="top-utility" aria-expanded="false" aria-label="Más opciones">···</button>
        <div id="utilityMenu" class="utility-menu hidden">
          <button id="settingsBtn">Ajustes</button>
          <button id="backupBtn">Respaldo</button>
        </div>
      </div>
      <input id="importFile" type="file" accept="application/json" hidden>
    </div>
  </header>

  <div class="workspace">
    <main id="main" class="main-panel"></main>
    <aside id="library" class="library-panel"></aside>
  </div>
</div>

<div id="modalRoot"></div>

<div class="orientation-guard" aria-live="polite" aria-hidden="true">
  <div class="orientation-message">
    <div class="orientation-mark">TUCONTU</div>
    <h2>Usa el iPhone en vertical.</h2>
    <p>La mesa está medida para trabajar en retrato sin scroll.</p>
  </div>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
